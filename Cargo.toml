# Nib — a rich text engine for COSMIC.
#
# The workspace splits at exactly one seam, and the seam is the whole design:
# `nib-model` knows what a document *is* and never learns what a pixel is.
# Everything above it — the serialisers, the widget — is replaceable without
# touching the model, and the model is testable without a compositor.
#
# That seam is ProseMirror's. It is also why this is a workspace rather than a
# crate with features: an application that renders a document does not need
# html5ever, and one that converts documents on a server does not need wgpu.

[workspace]
resolver = "3"
# Members are added as they are written, rather than declared up front and
# left empty: an empty crate in the workspace is a crate that compiles, and a
# crate that compiles is one nobody notices is a stub.
members = ["crates/nib-model", "crates/nib-html"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# MPL-2.0, like libcosmic and like the cosmic-pim substrate. Applications that
# link Nib stay whatever licence they are; the file-level copyleft asks only
# that changes to *these* files come back.
license = "MPL-2.0"
repository = "https://github.com/Magnetar-OS/cosmic-ext-nib"
rust-version = "1.98.1"
authors = ["Dominikos Pritis"]

[workspace.dependencies]
# Short names in `[dependencies]`, prefixed names on crates.io. The `package`
# key is what lets both be true.
nib-model = { path = "crates/nib-model", version = "0.1.0", package = "cosmic-ext-nib-model" }
nib-html = { path = "crates/nib-html", version = "0.1.0", package = "cosmic-ext-nib-html" }
nib-markdown = { path = "crates/nib-markdown", version = "0.1.0", package = "cosmic-ext-nib-markdown" }
nib-text = { path = "crates/nib-text", version = "0.1.0", package = "cosmic-ext-nib-text" }

thiserror = "2"
# One parser, and it is the one browsers agree with. A hand-written HTML
# tokeniser is how a sanitiser and a renderer come to disagree about what some
# bytes mean, which is the shape of every sanitiser bypass ever written.
html5ever = "0.39"
markup5ever_rcdom = "0.39"
regex = "1"
unicode-segmentation = "1"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Declared here rather than on the clippy command line, so it applies in the
# editor and in CI alike.
pedantic = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
